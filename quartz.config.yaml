layout:
  groups:
    brand:
      priority: 10
      direction: row
      wrap: nowrap
      gap: 0.75rem
    toolbar:
      priority: 35
      direction: row
      wrap: nowrap
      gap: 0.5rem
    custom-8:
      priority: 40
      direction: row
      wrap: wrap
      gap: 1.5rem
