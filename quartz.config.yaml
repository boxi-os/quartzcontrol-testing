# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: test2
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: de-DE
  baseUrl: boxi-os.github.io/quartzcontrol-testing
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Instrument Sans
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#FCFCFA"
        lightgray: "#DDDDDD"
        gray: "#5F5F5F"
        darkgray: "#333333"
        dark: "#17171A"
        secondary: "#1463A3"
        tertiary: "#196B6B"
        highlight: rgba(42, 78, 108, 0.10)
        textHighlight: rgba(226, 189, 92, 0.55)
      darkMode:
        light: "#16171A"
        lightgray: "#2E2E2E"
        gray: "#A1A1A1"
        darkgray: "#DDDDDD"
        dark: "#FCFCFA"
        secondary: "#699DC3"
        tertiary: "#2CAFAD"
        highlight: rgba(140, 184, 218, 0.12)
        textHighlight: rgba(140, 184, 218, 0.30)
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableYouTubeEmbed: true
      enableVideoEmbed: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 10
      display: all
    options:
      maxDepth: 6
      minEntries: 1
      showByDefault: true
      collapseByDefault: false
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: ultra-lobster
      mode: both
      styleSettings:
        o-theme-settings@@o-header-line-h1: true
        o-theme-settings@@o-red: true
        cupertino@@secondary: "#ff0000"
        cupertino@@material-color: true
        ITS@@file-explorer-boldless: true
        ITS@@secondary: "#ff0000"
        ulu-theme-settings@@ulu-obsidianplus-cool-l: true
    order: 140
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 20
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 30
    options:
      folderDefaultState: open
      folderClickBehavior: link
      useSavedState: true
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 20
      display: desktop-only
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
      groupOptions:
        shrink: false
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: afterBody
      priority: 60
      group: custom-8
      groupOptions:
        grow: true
        shrink: true
        basis: 18rem
        align: stretch
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 40
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: header
      priority: 20
      group: brand
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 40
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: header
      priority: 50
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Quartz: https://quartz.jzhao.xyz/
        QuartzControl: https://github.com/boxi-os/QuartzControl
        Layout Box: https://github.com/boxi-os/quartz-layout-box
        Multilanguage: https://github.com/boxi-os/quartz-multilanguage
    layout:
      position: footer
      priority: 20
  - source: "@quartz-community/recent-notes"
    enabled: true
    options:
      limit: 5
      hideFolderPages: true
    layout:
      position: afterBody
      priority: 50
      group: custom-8
      groupOptions:
        grow: true
        shrink: true
        basis: 18rem
        align: stretch
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 10
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - section
        - zahl
        - wahr
        - falsch
        - liste
        - leer
        - number
        - truthy
        - falsy
        - list
        - empty
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: afterBody
      priority: 40
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 470
  - source: /Users/boxi/Documents/QuartzProjekte/gui-test/.quartz-gui/authored-frames/frame-1787519243386
    enabled: true
    options: {}
    order: 50
