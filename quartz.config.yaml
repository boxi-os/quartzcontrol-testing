      className: layout-box-mark
      placeholders: true
      frontmatterKey: layoutBoxMark
    layout:
      position: header
      priority: 10
      group: brand
  - source: github:boxi-os/quartz-multilanguage
    enabled: true
    order: 65
    options:
      languages:
        - code: de
          label: German
          native: Deutsch
          locale: de-DE
        - code: en
          label: English
          native: English
          locale: en-US
      defaultLanguage: de
      detection:
        - folder
        - suffix
        - frontmatter
      linking:
        - frontmatter
        - aliases
        - path
      frontmatterKeys:
        lang: lang
        key: translationKey
        translations: translations
      rootRedirect: none
      rememberChoice: true
      seo:
        hreflang: true
        ogLocale: true
        xDefault: default
      switcher:
        style: dropdown
        label: native
        showCurrent: true
        missing: home
        separator: "|"
      missingTranslationNotice: true
      availableTranslationNotice: true
      fallbackPages: none
      rewriteCrossLanguageLinks: false
      localizeDates: true
      publishLanguages: []
    layout:
      position: header
      group: toolbar
      priority: 60
  - source: github:boxi-os/quartz-layout-box
    enabled: true
    order: 505
    options:
      html: <span class="bar-page-name" aria-hidden="true"
        data-section="{{frontmatter.section}}"></span>
      className: layout-box-page-name
      placeholders: true
      frontmatterKey: layoutBoxPageName
    layout:
      position: header
      priority: 30
      group: brand
  - source: github:boxi-os/quartz-layout-box
    enabled: true
    order: 510
    options:
      file: sidebar-note.md
      title: Über dieses Handbuch
      collapsible: true
      collapsed: true
      className: layout-box-note
      frontmatterKey: layoutBoxNote
      byLang:
        en:
          file: sidebar-note.en.md
          title: About this handbook
    layout:
      position: left
      priority: 40
      display: desktop-only
  - source: github:boxi-os/quartz-layout-box
    enabled: true
    order: 520
    options:
      html: <p>Auf einem schmalen Bildschirm ist die Navigation oben eingeklappt.</p>
      className: layout-box-hint
      frontmatterKey: layoutBoxHint
      byLang:
        en:
          html: <p>On a narrow screen the navigation is collapsed at the top.</p>
    layout:
      position: afterBody
      priority: 70
      display: mobile-only
  - source: github:boxi-os/quartz-layout-box
    enabled: true
    order: 530
    options:
      title: Weiterlesen
      html: <p>Diese Seite gehört zu <a href="{{root}}/">{{siteTitle}}</a> — der
        Beispielvorlage für QuartzControl. Ein Überblick über alle Bereiche
        steht auf der <a href="{{root}}/">Startseite</a>.</p>
      className: layout-box-cta
      frontmatterKey: layoutBoxCta
      byLang:
        en:
          title: Read on
          html: <p>This page belongs to <a href="{{root}}/en/">{{siteTitle}}</a> — the
            example template for QuartzControl. An overview of every area is on
            the <a href="{{root}}/en/">English home page</a>.</p>
    layout:
      position: afterBody
      priority: 30
  - source: github:boxi-os/quartz-layout-box
    enabled: true
    order: 540
    options:
      html: "<p>{{siteTitle}} · Sprache: {{locale}} · Diese Seite:
        <code>{{slug}}</code></p>"
      className: layout-box-colophon
      frontmatterKey: layoutBoxColophon
      byLang:
        en:
          html: "<p>{{siteTitle}} · Language: {{locale}} · This page:
            <code>{{slug}}</code></p>"
    layout:
      position: footer
      priority: 10
  - source: github:boxi-os/quartz-layout-box
    enabled: true
    order: 550
    options:
      html: <style>.explorer
        .folder-container[data-folderpath="{{slug}}"]{background:var(--tpl-surface-tint)}.explorer
        .folder-container[data-folderpath="{{slug}}"]
        .folder-title{color:var(--secondary)}</style>
      className: layout-box-current-folder
      placeholders: true
    layout:
      position: footer
      priority: 20
layout:
  groups:
    brand:
      priority: 10
      direction: row
      wrap: nowrap
      gap: 0.75rem
    toolbar:
      priority: 35
      direction: row
      wrap: nowrap
      gap: 0.5rem
    custom-8:
      priority: 40
      direction: row
      wrap: wrap
      gap: 1.5rem
  byPageType:
    "404":
      template: focus
      positions:
        left: []
        right: []
        beforeBody: []
        afterBody: []
    content:
      template: editorial
    folder:
      template: index
    tag:
      template: index
    bases:
      template: index
    canvas:
      template: drawing
      positions:
        left: []
        right: []
    excalidraw:
      template: drawing
      positions:
        left: []
        right: []
