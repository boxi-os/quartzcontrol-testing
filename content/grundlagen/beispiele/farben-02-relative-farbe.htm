<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Transparente Variante mit relativer Farbangabe – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }
.bild { padding: 2rem; background: repeating-linear-gradient(45deg, #fbbf24 0 20px, #fff 20px 40px); }
.overlay { padding: 2rem; border: 1px solid #1f2328; }
</style>
<style data-beispiel>
:root { --bg-color: blue; }
.overlay { background: rgb(from var(--bg-color) r g b / 20%); }
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „Farben in CSS“</p>
  <h1>Transparente Variante mit relativer Farbangabe</h1>
  <p>Das Overlay übernimmt Rot, Grün und Blau aus <code>--bg-color</code> und setzt nur die Deckkraft auf 20 %.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<div class="bild"><div class="overlay">Overlay: rgb(from var(--bg-color) r g b / 20%)</div></div>
</main>
</body>
</html>
