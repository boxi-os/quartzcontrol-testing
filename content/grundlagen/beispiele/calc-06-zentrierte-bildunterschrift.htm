<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Zentrierte Bildunterschrift über dem Bild – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }
.fig { position: relative; margin: 0; height: 14rem; max-width: 40rem; background: linear-gradient(135deg, #94a3b8, #1e293b); }
figcaption { bottom: 1rem; padding: .5rem; background: rgb(255 255 255 / 85%); text-align: center; }
</style>
<style data-beispiel>
figcaption {
  position: absolute;
  max-width: 300px;
  left:  calc(50% - 150px);
  right: calc(50% - 150px);
}
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „CSS calc()“</p>
  <h1>Zentrierte Bildunterschrift über dem Bild</h1>
  <p>Die Bildunterschrift ist absolut positioniert und über <code>left</code>/<code>right</code> mit calc() mittig.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<figure class="fig"><figcaption>Bildunterschrift, höchstens 300 px breit</figcaption></figure>
</main>
</body>
</html>
