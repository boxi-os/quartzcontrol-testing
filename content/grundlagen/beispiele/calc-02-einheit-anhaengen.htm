<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Einheit anhängen: calc(var(--duration) * 1s) – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }
.time-bar { height: 1rem; max-width: 30rem; background: #e5e7eb; border-radius: .5rem; overflow: hidden; }
.time-bar div { height: 100%; background: #16a34a; transform-origin: left;
  animation-name: roundtime; animation-timing-function: linear; animation-fill-mode: forwards; }
@keyframes roundtime { to { transform: scaleX(0); } }
</style>
<style data-beispiel>
.time-bar { --duration: 9; }              /* auch als style="--duration: 9" im HTML */
.time-bar div {
  animation-duration: calc(var(--duration) * 1s);
}
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „CSS calc()“</p>
  <h1>Einheit anhängen: calc(var(--duration) * 1s)</h1>
  <p><code>--duration: 9</code> ist eine reine Zahl; erst <code>* 1s</code> macht daraus 9 Sekunden. Zum Wiederholen neu laden.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<div class="time-bar"><div></div></div>
</main>
</body>
</html>
