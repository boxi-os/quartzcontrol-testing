<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Spaltenanzahl je Breakpoint – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }
.cols { display: flex; flex-wrap: wrap; }
.col { box-sizing: border-box; padding: .5rem; border: 1px solid #fff; background: #c7d2fe; text-align: center; }
</style>
<style data-beispiel>
.col { width: calc(100% / 3); }

@media (min-width: 800px)  { .col { width: calc(100% / 8);  } }
@media (min-width: 1000px) { .col { width: calc(100% / 12); } }
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „CSS calc()“</p>
  <h1>Spaltenanzahl je Breakpoint</h1>
  <p>Fenster verbreitern: 3 Spalten, ab 800 px 8, ab 1000 px 12.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<div class="cols"><div class="col">1</div><div class="col">2</div><div class="col">3</div><div class="col">4</div><div class="col">5</div><div class="col">6</div><div class="col">7</div><div class="col">8</div><div class="col">9</div><div class="col">10</div><div class="col">11</div><div class="col">12</div></div>
</main>
</body>
</html>
