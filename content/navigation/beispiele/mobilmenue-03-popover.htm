<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Menü als Popover – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }
#menu-panel { inset: auto; top: 4rem; left: 1.25rem; margin: 0; padding: .5rem 1rem; border: 1px solid #d0d7de; }
#menu-panel ul { list-style: none; padding: 0; margin: 0; }
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „Mobile-Menü ohne Checkbox-Hack bauen“</p>
  <h1>Menü als Popover</h1>
  <p>„Menü“ klicken: Das Menü liegt über dem Inhalt; Klick daneben oder <code>Esc</code> schließt. Die Seite bleibt bedienbar.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<button type="button" class="menu-button" popovertarget="menu-panel">Menü</button>
<nav id="menu-panel" popover aria-label="Hauptmenü">
  <ul><li><a href="#">Start</a></li><li><a href="#">Leistungen</a></li><li><a href="#">Kontakt</a></li></ul>
</nav>
</main>
</body>
</html>
