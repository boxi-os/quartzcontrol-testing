<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Verschachtelte Karte – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }
.card { border: 2px solid #d0d7de; border-radius: .5rem; max-width: 30rem; }
</style>
<style data-beispiel>
.card {
  padding: 1rem;

  .title { font-size: 1.5rem; }

  &:hover { border-color: currentColor; }

  @media (min-width: 48rem) { padding: 2rem; }
}
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „CSS-Nesting“</p>
  <h1>Verschachtelte Karte</h1>
  <p>Hover setzt die Rahmenfarbe über <code>&amp;:hover</code>; ab 48 rem Fensterbreite wächst der Innenabstand über die verschachtelte Media Query.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<div class="card"><h2 class="title">Titel</h2><p>Karteninhalt</p></div>
</main>
</body>
</html>
