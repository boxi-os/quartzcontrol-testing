<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Karte anheben, Schatten per opacity – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }
.card { width: 16rem; padding: 1.5rem; background: #fff; border: 1px solid #d0d7de; border-radius: .75rem; }
</style>
<style data-beispiel>
.card {
  position: relative;
  transition: translate 200ms ease-out;
}
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 12px 24px rgb(0 0 0 / 20%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms ease-out;
}
.card:hover { translate: 0 -4px; }
.card:hover::after { opacity: 1; }
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „CSS-Transitions und Keyframe-Animationen“</p>
  <h1>Karte anheben, Schatten per opacity</h1>
  <p>Hover über die Karte: Sie hebt sich an, der Schatten blendet ein. Der Link bleibt klickbar.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<div class="card"><p>Karte</p><a href="#">Link in der Karte</a></div>
</main>
</body>
</html>
