<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Dauer eines Übergangs an der Gruppe setzen – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }

</style>
<style data-beispiel>
::view-transition-group(root) {
  animation-duration: 0.3s;
}
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „View Transitions“</p>
  <h1>Dauer eines Übergangs an der Gruppe setzen</h1>
  <p>Button klicken: Der Inhalt wechselt per <code>document.startViewTransition()</code>; die Überblendung dauert 0,3 Sekunden.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<button id="wechsel">Inhalt wechseln</button>
<p id="text" style="font-size: 2rem">Zustand A</p>
</main>
<script>
// Rahmen-Skript: löst den Übergang aus – nicht Teil des Codeblocks
let zustand = "A";
document.getElementById("wechsel").addEventListener("click", () => {
  const update = () => { zustand = zustand === "A" ? "B" : "A"; document.getElementById("text").textContent = "Zustand " + zustand; };
  if (document.startViewTransition) document.startViewTransition(update); else update();
});
</script>
</body>
</html>
