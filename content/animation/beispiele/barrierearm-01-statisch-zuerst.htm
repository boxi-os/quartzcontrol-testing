<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beispiel: Statisch zuerst, Bewegung als Zusatz – CSS-Notizen</title>
<style>
/* Rahmen der Beispielseite – nicht Teil des Beispiels */
:root { color-scheme: light; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; background: #fff; }
.beispiel-kopf { padding: 1rem 1.25rem; background: #f3f4f6; border-bottom: 1px solid #d0d7de; }
.beispiel-kopf.unten { border-top: 1px solid #d0d7de; border-bottom: 0; margin-top: 2rem; }
.beispiel-kopf h1 { font-size: 1.25rem; line-height: 1.3; margin: .25rem 0; }
.beispiel-kopf p { margin: .25rem 0; max-width: 60rem; }
.beispiel-kopf .klein { font-size: .875rem; color: #57606a; }
.beispiel-buehne { padding: 1.25rem; }
.fuell p { max-width: 38rem; }
@keyframes slide-in { from { opacity: 0; translate: 0 2rem; } to { opacity: 1; translate: 0 0; } }
.hero-image { max-width: 40rem; height: 12rem; border-radius: .75rem; background: linear-gradient(135deg, #60a5fa, #1e3a8a); }
</style>
<style data-beispiel>
/* statische Grundstile */
.hero-image { opacity: 1; }

@media (prefers-reduced-motion: no-preference) {
  .hero-image {
    animation: slide-in 600ms ease-out both;
  }
}
</style>
</head>
<body>
<header class="beispiel-kopf">
  <p class="klein">Beispiel zur Notiz „Barrierearme Animationen“</p>
  <h1>Statisch zuerst, Bewegung als Zusatz</h1>
  <p>Beim Laden gleitet die Fläche herein. Mit aktivierter Systemeinstellung „Bewegung reduzieren“ steht sie sofort still da. Zum Wiederholen neu laden.</p>
  <p class="klein">Getestet in Chrome 152. Browserstand und Einordnung: siehe Notiz.</p>
</header>
<main class="beispiel-buehne">
<div class="hero-image" role="img" aria-label="Beispielfläche"></div>
</main>
</body>
</html>
